# 本体类型约束配置
# 定义允许的节点类型与属性要求

# 配置版本号
version: "3.0.0-graphrag-pipeline"

# 节点类型定义
node_types:
  Document:
    description: "源文档"
    required_properties:
      - title
      - id
    optional_properties:
      - url
      - source_type
      - author
      - doc_id
      - created_at
      - updated_at

  Chunk:
    description: "文本块"
    required_properties:
      - id
      - doc_id
      - text
    optional_properties:
      - resolved_text
      - chunk_index
      - section_path
      - page_num
      - sentence_ids
      - sentence_count
      - window_start
      - window_end
      - embedding
      - coreference_aliases
      - coref_mode
      - build_version
      - created_at
      - updated_at

  Concept:
    description: "概念实体"
    required_properties:
      - name
      - id
    optional_properties:
      - description
      - domain
      - aliases
      - importance
      - frequency
      - embedding
      - build_version
      - created_at
      - updated_at

  Claim:
    description: "论断/声明"
    required_properties:
      - id
      - text
    optional_properties:
      - doc_id
      - chunk_id
      - sentence_ids
      - claim_type
      - confidence
      - modality
      - polarity
      - certainty
      - evidence_span
      - section_path
      - embedding
      - build_version
      - created_at
      - updated_at

  Theme:
    description: "主题社区"
    required_properties:
      - id
      - label
    optional_properties:
      - summary
      - level
      - member_count
      - keywords
      - embedding
      - build_version
      - created_at
      - updated_at

  Entity:
    description: "通用实体"
    required_properties:
      - id
      - name
    optional_properties:
      - description
      - type
      - properties
      - embedding
      - build_version
      - created_at
      - updated_at

# 关系类型定义
relationship_types:
  MENTIONS:
    description: "Chunk 提及 Concept"
    source: [Chunk, Document]
    target: [Concept, Claim]
    properties:
      - confidence

  CONTAINS_CLAIM:
    description: "Chunk 包含 Claim"
    source: [Chunk]
    target: [Claim]
    properties:
      - confidence

  BELONGS_TO_THEME:
    description: "Concept 属于 Theme"
    source: [Concept, Claim]
    target: [Theme]
    properties:
      - confidence

  RELATED_TO:
    description: "Concept 之间的关联"
    source: [Concept, Claim, Document]
    target: [Concept, Claim, Document]
    properties:
      - confidence

  SUPPORTS:
    description: "Claim 支持 Concept"
    source: [Claim]
    target: [Concept, Claim]
    properties:
      - confidence

  CONTRADICTS:
    description: "Claim 反驳 Concept"
    source: [Claim]
    target: [Concept, Claim]
    properties:
      - confidence

  EVIDENCE_FROM:
    description: "证据来源"
    source: [Concept, Claim]
    target: [Chunk]
    properties:
      - confidence
      - doc_id
      - section_path
      - sentence_ids

  CONTAINS:
    description: "Document 包含 Chunk"
    source: [Document]
    target: [Chunk]
    properties:
      - confidence

  BELONGS_TO:
    description: "归属关系"
    source: [Concept, Document]
    target: [Concept, Document, Theme]
    properties:
      - confidence

  RELATION:
    description: "通用关系"
    source: [Concept, Claim, Document, Chunk]
    target: [Concept, Claim, Document, Chunk]
    properties:
      - confidence
      - weight

# 域约束
domain_constraints:
  allowed_domains:
    - "software_engineering"

# 数据质量约束
quality_constraints:
  confidence_min: 0.0
  confidence_max: 1.0
  embedding_dimension: 1536
