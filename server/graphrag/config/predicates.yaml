# 谓词白名单与映射配置

# 配置版本号
version: "3.0.0-graphrag-pipeline"

# 标准谓词集合
standard:
  - MENTIONS
  - CONTAINS_CLAIM
  - BELONGS_TO_THEME
  - RELATED_TO
  - SUPPORTS
  - CONTRADICTS
  - EVIDENCE_FROM
  - CONTAINS
  - BELONGS_TO
  - RELATION

# 自然语言谓词映射到标准谓词
mappings:
  # BELONGS_TO 映射
  "属于": BELONGS_TO
  "隶属于": BELONGS_TO
  "is_a": BELONGS_TO
  "subclass_of": BELONGS_TO

  # MENTIONS 映射
  "提及": MENTIONS
  "提到": MENTIONS
  "引用": MENTIONS
  "references": MENTIONS

  # CONTAINS_CLAIM 映射
  "包含论断": CONTAINS_CLAIM
  "包含声明": CONTAINS_CLAIM
  "主张": CONTAINS_CLAIM

  # BELONGS_TO_THEME 映射
  "属于主题": BELONGS_TO_THEME
  "归类于": BELONGS_TO_THEME
  "主题分类": BELONGS_TO_THEME

  # RELATED_TO 映射
  "关联": RELATED_TO
  "相关": RELATED_TO
  "关联于": RELATED_TO
  "与...相关": RELATED_TO

  # SUPPORTS 映射
  "支持": SUPPORTS
  "证实": SUPPORTS
  "佐证": SUPPORTS

  # CONTRADICTS 映射
  "反驳": CONTRADICTS
  "矛盾": CONTRADICTS
  "冲突": CONTRADICTS
  "反对": CONTRADICTS

  # EVIDENCE_FROM 映射
  "证据来自": EVIDENCE_FROM
  "来源于证据": EVIDENCE_FROM
  "基于": EVIDENCE_FROM
  "来自": EVIDENCE_FROM
  "源自": EVIDENCE_FROM
  "提取自": EVIDENCE_FROM

  # CONTAINS 映射
  "包含": CONTAINS
  "含有": CONTAINS

# 类型约束白名单
type_constraints:
  - source: Chunk
    predicate: MENTIONS
    target: [Concept, Claim]

  - source: Document
    predicate: MENTIONS
    target: [Concept, Claim]

  - source: Chunk
    predicate: CONTAINS_CLAIM
    target: [Claim]

  - source: Concept
    predicate: BELONGS_TO_THEME
    target: [Theme]

  - source: Claim
    predicate: BELONGS_TO_THEME
    target: [Theme]

  - source: Concept
    predicate: RELATED_TO
    target: [Concept, Claim, Document]

  - source: Claim
    predicate: RELATED_TO
    target: [Concept, Claim, Document]

  - source: Claim
    predicate: SUPPORTS
    target: [Concept, Claim]

  - source: Claim
    predicate: CONTRADICTS
    target: [Concept, Claim]

  - source: Concept
    predicate: EVIDENCE_FROM
    target: [Chunk]

  - source: Claim
    predicate: EVIDENCE_FROM
    target: [Chunk]

  - source: Document
    predicate: CONTAINS
    target: [Chunk]

  - source: Concept
    predicate: BELONGS_TO
    target: [Concept, Document, Theme]

  - source: Document
    predicate: BELONGS_TO
    target: [Concept, Document, Theme]

  - source: Claim
    predicate: RELATION
    target: [Claim, Concept]

  - source: Concept
    predicate: RELATION
    target: [Concept, Claim]

# 未匹配谓词处理策略
unmatched_strategy:
  mode: reject
  review_threshold: 0
  auto_expand:
    enabled: false
    min_occurrences: 0
    min_confidence: 0.0
