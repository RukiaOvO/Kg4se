[pytest]
# Pytest 配置文件

# 测试文件匹配规则
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 出力配置
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov-config=.coveragerc
    --cov=tests
    --cov-report=html
    --cov-report=term-missing

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 运行时间较长的测试
    graphrag: GraphRAG 相关测试
    api: API 端点测试
    service: 服务层测试
    db: 需要数据库的测试
    ai: 需要 AI 服务的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
; [coverage:run]
; # Restrict coverage scope to executed test suite to improve signal-to-noise
; source = 
;     tests
; omit = 
;     */__pycache__/*
;     */venv/*
;     */.venv/*
;     tests/conftest.py
;     tests/verify_quick.py
;     tests/test_documents_integration.py
;     tests/test_documents_final.py
;     tests/test_documents_fullstack.py
;     tests/test_documents_code.py
;     tests/test_domain_optimization.py
;     tests/test_graph_api.py
;     tests/test_kg_optimization_integration.py
;     tests/graphrag/stages/test_stage0_2_manual.py
;     tests/graphrag/stages/test_stage6_theme_builder.py
;     tests/test_services_coverage_extended.py
;     htmlcov/*
;     main.py
;     graphrag/*

[coverage:run]
# 包含应用代码目录
source = 
    graphrag
    infra
    models
    routes
    services
omit = 
    */__pycache__/*
    */venv/*
    */.venv/*
    tests/*
    htmlcov/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
omit = 
    tests/conftest.py
    tests/verify_quick.py
    tests/test_documents_integration.py
    tests/test_documents_final.py
    tests/test_documents_fullstack.py
    tests/test_documents_code.py
    tests/test_domain_optimization.py
    tests/test_graph_api.py
    tests/test_kg_optimization_integration.py
    tests/graphrag/stages/test_stage0_2_manual.py
    tests/graphrag/stages/test_stage6_theme_builder.py
    tests/test_services_coverage_extended.py
